services:
  - type: web
    name: buildpilot-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: VITE_API_URL
        sync: false
  - type: web
    name: buildpilot-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: buildpilot-db
          property: connectionString
      - key: AI_API_KEY
        sync: false
      - key: APP_ENV
        value: production
      - key: APP_ACCESS_TOKEN
        sync: false
      - key: AI_MODEL
        value: gpt-6-luna
      - key: FRONTEND_ORIGIN
        sync: false
databases:
  - name: buildpilot-db
    plan: free
    databaseName: buildpilot
    user: buildpilot
